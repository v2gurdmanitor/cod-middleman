<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>پنل مدیریت | COD MOBILE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top right,rgba(255,48,48,.14),transparent 35%),
        #050505;
    color:#fff;
    min-height:100vh;
}

header{
    height:70px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #222;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#ff3030;
}

.admin-label{
    color:#888;
    font-size:12px;
}

.container{
    width:94%;
    max-width:1200px;
    margin:30px auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.top h1{
    font-size:27px;
}

.top p{
    color:#777;
    font-size:12px;
    margin-top:7px;
}

button{
    border:none;
    background:#ff3030;
    color:#fff;
    padding:12px 17px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    font-weight:bold;
}

button:hover{
    background:#ff4545;
}

.refresh{
    background:#171717;
    border:1px solid #292929;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:25px;
}

.stat{
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:15px;
    padding:20px;
}

.stat-title{
    color:#777;
    font-size:11px;
    margin-bottom:10px;
}

.stat-value{
    font-size:24px;
    font-weight:bold;
}

.search{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search input{
    flex:1;
    background:#0d0d0d;
    border:1px solid #292929;
    color:#fff;
    padding:14px;
    border-radius:11px;
    outline:none;
    font-family:inherit;
}

.table-box{
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:18px;
    overflow:hidden;
}

.table-scroll{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    text-align:right;
    color:#777;
    font-size:11px;
    font-weight:normal;
    padding:17px;
    border-bottom:1px solid #222;
    background:#101010;
}

td{
    padding:17px;
    border-bottom:1px solid #1b1b1b;
    font-size:12px;
}

tr:hover td{
    background:#111;
}

.code{
    direction:ltr;
    color:#ff5555;
    font-weight:bold;
}

.price{
    font-weight:bold;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:10px;
}

.pending{
    color:#ffd15c;
    background:rgba(255,209,92,.08);
}

.active{
    color:#62ff82;
    background:rgba(98,255,130,.08);
}

.completed{
    color:#5cb8ff;
    background:rgba(92,184,255,.08);
}

.cancelled{
    color:#ff6666;
    background:rgba(255,102,102,.08);
}

.view-btn{
    background:#191919;
    border:1px solid #292929;
    padding:8px 12px;
    font-size:11px;
}

.empty{
    text-align:center;
    color:#555;
    padding:60px 20px;
}

.loading{
    text-align:center;
    color:#777;
    padding:40px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:100;
    padding:20px;
    overflow-y:auto;
}

.modal-box{
    width:min(750px,100%);
    margin:30px auto;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:20px;
    padding:25px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    width:auto;
    padding:7px 12px;
    background:#222;
}

.detail{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.detail-item{
    background:#080808;
    border:1px solid #1e1e1e;
    border-radius:12px;
    padding:15px;
}

.detail-title{
    color:#666;
    font-size:10px;
    margin-bottom:7px;
}

.detail-value{
    font-size:13px;
    word-break:break-word;
}

.description{
    grid-column:1/-1;
}

/* STATUS */

.status-actions{
    margin-top:20px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.status-actions button{
    width:auto;
    font-size:11px;
}

.status-pending{
    background:#8a6900;
}

.status-active{
    background:#16733b;
}

.status-completed{
    background:#175b91;
}

.status-cancelled{
    background:#8b2222;
}

/* CHAT */

.chat-box{
    margin-top:25px;
    border-top:1px solid #222;
    padding-top:20px;
}

.chat-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:15px;
}

.messages{
    height:320px;
    overflow-y:auto;
    background:#070707;
    border:1px solid #202020;
    border-radius:13px;
    padding:15px;
}

.no-message{
    text-align:center;
    color:#555;
    padding-top:120px;
    font-size:12px;
}

.message{
    max-width:85%;
    background:#171717;
    border:1px solid #242424;
    border-radius:12px;
    padding:11px 13px;
    margin-bottom:10px;
}

.message.admin{
    margin-right:auto;
    background:#2b1010;
    border-color:#652020;
}

.message-name{
    color:#ff5555;
    font-size:10px;
    margin-bottom:5px;
    font-weight:bold;
}

.message.admin .message-name{
    color:#ffcf5a;
}

.message-text{
    font-size:12px;
    line-height:1.8;
    word-break:break-word;
}

.message-time{
    color:#555;
    font-size:9px;
    margin-top:6px;
}

/* ADMIN SEND */

.admin-send{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.admin-send input{
    flex:1;
    background:#070707;
    border:1px solid #292929;
    color:#fff;
    padding:13px;
    border-radius:10px;
    outline:none;
    font-family:inherit;
}

.admin-send input:focus{
    border-color:#ff3030;
}

.admin-send button{
    width:100px;
}

.error{
    display:none;
    background:rgba(255,0,0,.08);
    border:1px solid rgba(255,0,0,.25);
    color:#ff7777;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
    font-size:12px;
}

@media(max-width:800px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .top{
        align-items:flex-start;
        flex-direction:column;
        gap:15px;
    }

    .detail{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr;
    }

    .search{
        flex-direction:column;
    }

    .admin-send button{
        width:80px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        COD <span>MOBILE</span>
    </div>

    <div class="admin-label">
        پنل مدیریت
    </div>

</header>


<div class="container">

    <div class="top">

        <div>

            <h1>
                مدیریت معاملات
            </h1>

            <p>
                مشاهده، مدیریت و گفت‌وگو با طرفین معامله
            </p>

        </div>

        <button
            class="refresh"
            onclick="loadDeals()"
        >
            🔄 بروزرسانی
        </button>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                کل معاملات
            </div>

            <div
                class="stat-value"
                id="totalCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                در انتظار
            </div>

            <div
                class="stat-value"
                id="pendingCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                فعال
            </div>

            <div
                class="stat-value"
                id="activeCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                تکمیل شده
            </div>

            <div
                class="stat-value"
                id="completedCount"
            >
                0
            </div>

        </div>

    </div>


    <div
        id="error"
        class="error"
    ></div>


    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="جستجو با کد معامله، نام یا شماره..."
            oninput="filterDeals()"
        >

    </div>


    <div class="table-box">

        <div class="table-scroll">

            <table>

                <thead>

                    <tr>

                        <th>کد معامله</th>
                        <th>نقش</th>
                        <th>نام</th>
                        <th>شماره</th>
                        <th>مبلغ</th>
                        <th>وضعیت</th>
                        <th>عملیات</th>

                    </tr>

                </thead>

                <tbody id="dealTable">

                    <tr>

                        <td
                            colspan="7"
                            class="loading"
                        >
                            در حال دریافت معاملات...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- MODAL -->

<div
    class="modal"
    id="modal"
    onclick="closeModal(event)"
>

    <div
        class="modal-box"
        onclick="event.stopPropagation()"
    >

        <div class="modal-head">

            <h2>
                جزئیات معامله
            </h2>

            <button
                class="close"
                onclick="hideModal()"
            >
                ✕
            </button>

        </div>


        <div
            class="detail"
            id="detail"
        ></div>


        <div class="status-actions">

            <button
                class="status-pending"
                onclick="changeStatus('pending')"
            >
                ⏳ در انتظار
            </button>

            <button
                class="status-active"
                onclick="changeStatus('active')"
            >
                🟢 فعال
            </button>

            <button
                class="status-completed"
                onclick="changeStatus('completed')"
            >
                ✅ تکمیل شده
            </button>

            <button
                class="status-cancelled"
                onclick="changeStatus('cancelled')"
            >
                ❌ لغو شده
            </button>

        </div>


        <!-- CHAT -->

        <div class="chat-box">

            <div class="chat-title">
                💬 گفت‌وگوی معامله
            </div>


            <div
                class="messages"
                id="modalMessages"
            >

                <div class="no-message">
                    در حال دریافت پیام‌ها...
                </div>

            </div>


            <!-- ADMIN SEND -->

            <div class="admin-send">

                <input
                    id="adminMessageInput"
                    type="text"
                    placeholder="پیام مدیر را بنویسید..."
                    autocomplete="off"
                >

                <button
                    id="adminSendButton"
                    onclick="sendAdminMessage()"
                >
                    ارسال
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
    "https://hctppmmaiqkzcgxncyhi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wP43H8AKwtVcTUBwcEzTxg_qKdFxzNa";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   VARIABLES
===================================== */

let allDeals = [];

let currentDeal = null;

let currentChannel = null;


/* =====================================
   ERROR
===================================== */

function showError(message){

    const box =
        document.getElementById("error");

    box.textContent =
        message;

    box.style.display =
        "block";
}


/* =====================================
   STATUS
===================================== */

function statusText(status){

    if(status === "pending")
        return "در انتظار";

    if(status === "active")
        return "فعال";

    if(status === "completed")
        return "تکمیل شده";

    if(status === "cancelled")
        return "لغو شده";

    return status || "---";
}


/* =====================================
   ROLE
===================================== */

function roleText(role){

    if(role === "seller")
        return "💼 فروشنده";

    if(role === "buyer")
        return "🛒 خریدار";

    if(role === "admin")
        return "👑 مدیر";

    return role || "---";
}


/* =====================================
   PRICE
===================================== */

function formatPrice(price){

    if(
        price === null ||
        price === undefined ||
        price === ""
    ){

        return "---";

    }

    return Number(price)
        .toLocaleString("fa-IR")
        + " تومان";
}


/* =====================================
   LOAD DEALS
===================================== */

async function loadDeals(){

    const table =
        document.getElementById(
            "dealTable"
        );


    table.innerHTML = `
        <tr>
            <td colspan="7" class="loading">
                در حال دریافت معاملات...
            </td>
        </tr>
    `;


    const result =
        await supabaseClient
        .from("deals")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(result.error){

        showError(
            "دریافت معاملات انجام نشد: " +
            result.error.message
        );

        return;
    }


    allDeals =
        result.data || [];


    updateStats();

    renderDeals(
        allDeals
    );
}


/* =====================================
   STATS
===================================== */

function updateStats(){

    document
        .getElementById("totalCount")
        .textContent =
        allDeals.length;


    document
        .getElementById("pendingCount")
        .textContent =
        allDeals.filter(
            d => d.status === "pending"
        ).length;


    document
        .getElementById("activeCount")
        .textContent =
        allDeals.filter(
            d => d.status === "active"
        ).length;


    document
        .getElementById("completedCount")
        .textContent =
        allDeals.filter(
            d => d.status === "completed"
        ).length;

}


/* =====================================
   RENDER DEALS
===================================== */

function renderDeals(deals){

    const table =
        document.getElementById(
            "dealTable"
        );


    if(!deals.length){

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    هیچ معامله‌ای پیدا نشد.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML =
        deals.map(
            deal => `

            <tr>

                <td class="code">
                    ${escapeHtml(
                        deal.deal_code || "---"
                    )}
                </td>

                <td>
                    ${roleText(
                        deal.role
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        deal.name || "---"
                    )}
                </td>

                <td dir="ltr">
                    ${escapeHtml(
                        deal.phone || "---"
                    )}
                </td>

                <td class="price">
                    ${formatPrice(
                        deal.price
                    )}
                </td>

                <td>

                    <span class="status ${deal.status}">
                        ${statusText(
                            deal.status
                        )}
                    </span>

                </td>

                <td>

                    <button
                        class="view-btn"
                        onclick="viewDeal('${deal.deal_code}')"
                    >
                        👁 مشاهده
                    </button>

                </td>

            </tr>

            `
        )
        .join("");
}


/* =====================================
   SEARCH
===================================== */

function filterDeals(){

    const value =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if(!value){

        renderDeals(
            allDeals
        );

        return;
    }


    const filtered =
        allDeals.filter(
            deal => {

                return (

                    String(
                        deal.deal_code || ""
                    )
                    .toLowerCase()
                    .includes(value)

                    ||

                    String(
                        deal.name || ""
                    )
                    .toLowerCase()
                    .includes(value)

                    ||

                    String(
                        deal.phone || ""
                    )
                    .includes(value)

                );

            }
        );


    renderDeals(
        filtered
    );
}


/* =====================================
   VIEW DEAL
===================================== */

async function viewDeal(code){

    const deal =
        allDeals.find(
            d => d.deal_code === code
        );


    if(!deal)
        return;


    currentDeal =
        deal;


    const detail =
        document.getElementById(
            "detail"
        );


    detail.innerHTML = `

        <div class="detail-item">

            <div class="detail-title">
                کد معامله
            </div>

            <div
                class="detail-value"
                dir="ltr"
            >
                ${escapeHtml(
                    deal.deal_code || "---"
                )}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-title">
                وضعیت
            </div>

            <div class="detail-value">
                ${statusText(
                    deal.status
                )}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-title">
                نقش
            </div>

            <div class="detail-value">
                ${roleText(
                    deal.role
                )}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-title">
                نام
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    deal.name || "---"
                )}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-title">
                شماره تماس
            </div>

            <div
                class="detail-value"
                dir="ltr"
            >
                ${escapeHtml(
                    deal.phone || "---"
                )}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-title">
                مبلغ
            </div>

            <div class="detail-value">
                ${formatPrice(
                    deal.price
                )}
            </div>

        </div>


        <div class="detail-item description">

            <div class="detail-title">
                توضیحات
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    deal.description ||
                    "توضیحاتی ثبت نشده است."
                )}
            </div>

        </div>

    `;


    document
        .getElementById("modal")
        .style.display =
        "block";


    await loadMessages(
        deal.deal_code
    );


    startMessageRealtime(
        deal.deal_code
    );
}


/* =====================================
   LOAD MESSAGES
===================================== */

async function loadMessages(code){

    const box =
        document.getElementById(
            "modalMessages"
        );


    box.innerHTML = `
        <div class="no-message">
            در حال دریافت پیام‌ها...
        </div>
    `;


    const result =
        await supabaseClient
        .from("messages")
        .select("*")
        .eq(
            "deal_code",
            code
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(result.error){

        box.innerHTML = `
            <div class="no-message">
                خطا در دریافت پیام‌ها
            </div>
        `;

        console.error(
            result.error
        );

        return;
    }


    const messages =
        result.data || [];


    box.innerHTML = "";


    if(!messages.length){

        box.innerHTML = `
            <div class="no-message">
                هنوز پیامی ارسال نشده است.
            </div>
        `;

        return;
    }


    messages.forEach(
        renderMessage
    );


    scrollMessages();
}


/* =====================================
   RENDER MESSAGE
===================================== */

function renderMessage(message){

    const box =
        document.getElementById(
            "modalMessages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    if(
        message.sender_role === "admin"
    ){

        div.classList.add(
            "admin"
        );

    }


    const name =
        message.sender_role === "admin"
            ? "👑 مدیر"
            : (
                message.sender_name ||
                "کاربر"
            );


    div.innerHTML = `

        <div class="message-name">
            ${escapeHtml(name)}
        </div>

        <div class="message-text">
            ${escapeHtml(
                message.message || ""
            )}
        </div>

        <div class="message-time">
            ${
                message.created_at
                ?
                new Date(
                    message.created_at
                ).toLocaleString(
                    "fa-IR"
                )
                :
                ""
            }
        </div>

    `;


    box.appendChild(div);
}


/* =====================================
   SEND ADMIN MESSAGE
===================================== */

async function sendAdminMessage(){

    if(!currentDeal){

        alert(
            "ابتدا یک معامله را باز کنید."
        );

        return;
    }


    const input =
        document.getElementById(
            "adminMessageInput"
        );


    const button =
        document.getElementById(
            "adminSendButton"
        );


    const text =
        input.value.trim();


    if(!text)
        return;


    button.disabled =
        true;


    const result =
        await supabaseClient
        .from("messages")
        .insert({

            deal_code:
                currentDeal.deal_code,

            sender_name:
                "مدیر",

            sender_role:
                "admin",

            message:
                text,

            visitor_id:
                "ADMIN"

        })
        .select()
        .single();


    if(result.error){

        console.error(
            result.error
        );

        alert(
            "ارسال پیام انجام نشد:\n" +
            result.error.message
        );

        button.disabled =
            false;

        return;
    }


    input.value =
        "";


    renderMessage(
        result.data
    );


    scrollMessages();


    button.disabled =
        false;


    input.focus();
}


/* =====================================
   REALTIME CHAT
===================================== */

function startMessageRealtime(code){

    if(currentChannel){

        supabaseClient.removeChannel(
            currentChannel
        );

    }


    currentChannel =
        supabaseClient
        .channel(
            "admin-chat-" + code
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"messages",
                filter:
                    "deal_code=eq." + code
            },
            payload => {

                const message =
                    payload.new;


                /*
                پیام خود مدیر قبلاً
                در صفحه اضافه شده است.
                */

                if(
                    message.sender_role === "admin"
                ){

                    return;

                }


                renderMessage(
                    message
                );


                scrollMessages();

            }
        )
        .subscribe();

}


/* =====================================
   SCROLL CHAT
===================================== */

function scrollMessages(){

    const box =
        document.getElementById(
            "modalMessages"
        );


    box.scrollTop =
        box.scrollHeight;
}


/* =====================================
   CHANGE STATUS
===================================== */

async function changeStatus(status){

    if(!currentDeal){

        alert(
            "معامله‌ای انتخاب نشده است."
        );

        return;
    }


    const result =
        await supabaseClient
        .from("deals")
        .update({

            status:
                status

        })
        .eq(
            "deal_code",
            currentDeal.deal_code
        );


    if(result.error){

        alert(
            "تغییر وضعیت انجام نشد:\n" +
            result.error.message
        );

        console.error(
            result.error
        );

        return;
    }


    currentDeal.status =
        status;


    alert(
        "✅ وضعیت معامله تغییر کرد."
    );


    hideModal();

    await loadDeals();
}


/* =====================================
   CLOSE MODAL
===================================== */

function hideModal(){

    document
        .getElementById("modal")
        .style.display =
        "none";


    if(currentChannel){

        supabaseClient.removeChannel(
            currentChannel
        );

        currentChannel =
            null;
    }


    currentDeal =
        null;
}


function closeModal(event){

    if(
        event.target.id === "modal"
    ){

        hideModal();

    }
}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";

    return div.innerHTML;
}


/* =====================================
   ENTER SEND
===================================== */

document
    .getElementById(
        "adminMessageInput"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                event.preventDefault();

                sendAdminMessage();

            }

        }
    );


/* =====================================
   START
===================================== */

loadDeals();

</script>
