<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ایجاد معامله | V2GUARD</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(255,48,48,.12), transparent 35%),
                #050505;
            color: #fff;
            min-height: 100vh;
        }

        header {
            height: 70px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ff3030;
        }

        .container {
            width: 92%;
            max-width: 650px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .box {
            background: rgba(15,15,15,.95);
            border: 1px solid #222;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 70px rgba(0,0,0,.4);
        }

        .notice {
            background: rgba(255,48,48,.07);
            border: 1px solid rgba(255,48,48,.2);
            color: #aaa;
            padding: 15px;
            border-radius: 11px;
            font-size: 12px;
            line-height: 1.9;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #ccc;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            background: #070707;
            color: #fff;
            border: 1px solid #292929;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #ff3030;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .create-button {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 11px;
            background: #ff3030;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-button:hover {
            background: #ff4444;
        }

        .create-button:disabled {
            opacity: .55;
            cursor: wait;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(60,255,100,.05);
            border: 1px solid rgba(60,255,100,.25);
            border-radius: 14px;
        }

        #result h3 {
            color: #6dff82;
            margin-bottom: 15px;
        }

        .deal-code {
            direction: ltr;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 16px;
            background: #080808;
            border-radius: 10px;
            margin: 15px 0;
        }

        .link {
            direction: ltr;
            width: 100%;
            padding: 12px;
            background: #050505;
            border: 1px solid #222;
            border-radius: 9px;
            color: #aaa;
            font-size: 11px;
        }

        .copy {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            background: #191919;
            color: white;
            border: 1px solid #333;
            border-radius: 9px;
            cursor: pointer;
            font-family: inherit;
        }

        .open {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            text-align: center;
            background: #ff3030;
            color: white;
            border-radius: 9px;
            text-decoration: none;
            font-size: 13px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 12px;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 13px;
            background: rgba(255,0,0,.08);
            border: 1px solid rgba(255,0,0,.25);
            border-radius: 10px;
            color: #ff7777;
            font-size: 12px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        V2<span>GUARD</span>
    </div>
</header>

<div class="container">

    <h1>ایجاد معامله</h1>

    <p class="subtitle">
        اطلاعات اولیه معامله را وارد کنید
    </p>

    <div class="box">

        <div class="notice">
            ⚠️ اطلاعات حساس اکانت، رمز Gmail یا رمز ورود را در این مرحله وارد نکنید.
            این صفحه فقط برای ایجاد معامله است.
        </div>

        <div class="field">
            <label>نقش شما</label>

            <select id="role">
                <option value="seller">فروشنده</option>
                <option value="buyer">خریدار</option>
            </select>
        </div>

        <div class="field">
            <label>نام یا شناسه</label>

            <input
                id="name"
                type="text"
                placeholder="مثلاً V2GUARD"
            >
        </div>

        <div class="field">
            <label>شماره تماس</label>

            <input
                id="phone"
                type="tel"
                placeholder="09xxxxxxxxx"
            >
        </div>

        <div class="field">
            <label>مبلغ معامله (تومان)</label>

            <input
                id="price"
                type="number"
                min="1"
                placeholder="مثلاً 500000"
            >
        </div>

        <div class="field">
            <label>توضیحات معامله</label>

            <textarea
                id="description"
                placeholder="مثلاً اکانت کالاف، لول، تعداد CP و شرایط معامله..."
            ></textarea>
        </div>

        <button
            type="button"
            class="create-button"
            id="createButton"
        >
            ایجاد اتاق معامله
        </button>

        <div
            class="error"
            id="errorBox"
        ></div>

        <div id="result">

            <h3>
                ✅ معامله با موفقیت ثبت شد
            </h3>

            <div>
                کد معامله:
            </div>

            <div
                class="deal-code"
                id="dealCode"
            >
                ---
            </div>

            <div>
                لینک اختصاصی معامله:
            </div>

            <input
                class="link"
                id="dealLink"
                readonly
            >

            <button
                type="button"
                class="copy"
                id="copyButton"
            >
                📋 کپی لینک معامله
            </button>

            <a
                id="openButton"
                class="open"
                href="#"
            >
                ورود به اتاق معامله
            </a>

        </div>

        <a
            href="index.html"
            class="back"
        >
            ← بازگشت به صفحه اصلی
        </a>

    </div>
</div>

<script>

    /* ============================
       SUPABASE
    ============================ */

    const SUPABASE_URL =
        "https://hctppmmaiqkzcgxncyhi.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_wP43H8AKwtVcTUBwcEzTxg_qKdFxzNa";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ============================
       ساخت کد معامله
    ============================ */

    function generateDealCode() {

        const characters =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let code = "V2G-";

        for (let i = 0; i < 6; i++) {

            code += characters.charAt(
                Math.floor(
                    Math.random() *
                    characters.length
                )
            );

        }

        return code;
    }


    /* ============================
       نمایش خطا
    ============================ */

    function showError(message) {

        const errorBox =
            document.getElementById("errorBox");

        errorBox.textContent = message;

        errorBox.style.display = "block";
    }


    function hideError() {

        document
            .getElementById("errorBox")
            .style.display = "none";
    }


    /* ============================
       ایجاد معامله
    ============================ */

    document
        .getElementById("createButton")
        .addEventListener(
            "click",
            async function () {

                hideError();

                const button = this;

                const role =
                    document
                        .getElementById("role")
                        .value;

                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();

                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();

                const price =
                    document
                        .getElementById("price")
                        .value
                        .trim();

                const description =
                    document
                        .getElementById("description")
                        .value
                        .trim();


                if (!name || !phone || !price) {

                    showError(
                        "لطفاً نام، شماره تماس و مبلغ معامله را وارد کنید."
                    );

                    return;
                }


                button.disabled = true;

                button.textContent =
                    "در حال ثبت معامله...";


                try {

                    let dealCode;

                    let inserted = false;


                    for (
                        let attempt = 0;
                        attempt < 5;
                        attempt++
                    ) {

                        dealCode =
                            generateDealCode();


                        const { error } =
                            await supabaseClient
                                .from("deals")
                                .insert({

                                    deal_code:
                                        dealCode,

                                    role:
                                        role,

                                    name:
                                        name,

                                    phone:
                                        phone,

                                    price:
                                        Number(price),

                                    description:
                                        description || null

                                });


                        if (!error) {

                            inserted = true;

                            break;
                        }


                        console.error(error);


                        if (
                            !error.message
                                .toLowerCase()
                                .includes("duplicate")
                        ) {

                            throw error;
                        }

                    }


                    if (!inserted) {

                        throw new Error(
                            "ساخت کد یکتای معامله انجام نشد. دوباره تلاش کنید."
                        );

                    }


                    const dealLink =
                        window.location.origin +
                        window.location.pathname
                            .replace(
                                "create-deal.html",
                                "deal.html"
                            ) +
                        "?id=" +
                        encodeURIComponent(
                            dealCode
                        );


                    document
                        .getElementById("dealCode")
                        .textContent =
                        dealCode;


                    document
                        .getElementById("dealLink")
                        .value =
                        dealLink;


                    document
                        .getElementById("openButton")
                        .href =
                        dealLink;


                    document
                        .getElementById("result")
                        .style.display =
                        "block";


                    document
                        .getElementById("result")
                        .scrollIntoView({
                            behavior: "smooth"
                        });


                } catch (error) {

                    console.error(
                        "SUPABASE ERROR:",
                        error
                    );

                    showError(
                        "ثبت معامله انجام نشد: " +
                        error.message
                    );

                } finally {

                    button.disabled = false;

                    button.textContent =
                        "ایجاد اتاق معامله";

                }

            }
        );


    /* ============================
       کپی لینک
    ============================ */

    document
        .getElementById("copyButton")
        .addEventListener(
            "click",
            async function () {

                const link =
                    document
                        .getElementById("dealLink")
                        .value;

                try {

                    await navigator
                        .clipboard
                        .writeText(link);

                    this.textContent =
                        "✅ لینک کپی شد";

                    setTimeout(() => {

                        this.textContent =
                            "📋 کپی لینک معامله";

                    }, 2000);

                } catch (error) {

                    const input =
                        document
                            .getElementById("dealLink");

                    input.select();

                    alert(
                        "لینک انتخاب شد؛ آن را کپی کنید."
                    );

                }

            }
        );

</script>

</body>
</html>
