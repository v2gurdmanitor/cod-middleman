
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ایجاد معامله | V2GUARD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #1d0909, transparent 35%),
                #050505;
            color: #fff;
            min-height: 100vh;
        }

        header {
            padding: 20px 7%;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ff3030;
        }

        .container {
            width: min(650px, 92%);
            margin: 55px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .title p {
            color: #888;
            line-height: 1.8;
            font-size: 14px;
        }

        .box {
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 70px rgba(0,0,0,.35);
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            color: #ddd;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #292929;
            color: white;
            padding: 14px;
            border-radius: 11px;
            outline: none;
            font-family: inherit;
            transition: .2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #ff3030;
            box-shadow: 0 0 0 3px rgba(255,48,48,.08);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .notice {
            background: rgba(255,48,48,.06);
            border: 1px solid rgba(255,48,48,.2);
            color: #aaa;
            padding: 15px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.9;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            border: none;
            background: #ff3030;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
        }

        button:hover {
            background: #ff4545;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,48,48,.2);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #fff;
        }

        @media(max-width:600px) {
            .container {
                margin-top: 35px;
            }

            .box {
                padding: 22px;
            }

            .title h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        V2<span>GUARD</span>
    </div>
</header>

<div class="container">

    <div class="title">
        <h1>ایجاد معامله</h1>

        <p>
            اطلاعات اولیه معامله را وارد کنید تا
            اتاق اختصاصی معامله ایجاد شود.
        </p>
    </div>

    <div class="box">

        <div class="notice">
            ⚠️ توجه: اطلاعات ورود به اکانت را در این مرحله وارد نکنید.
            اطلاعات حساس فقط در مرحله انتقال و پس از تأیید معامله مدیریت خواهد شد.
        </div>

        <div class="field">
            <label>نقش شما</label>

            <select>
                <option value="seller">فروشنده</option>
                <option value="buyer">خریدار</option>
            </select>
        </div>

        <div class="field">
            <label>نام یا شناسه شما</label>

            <input
                type="text"
                placeholder="مثلاً V2GUARD"
            >
        </div>

        <div class="field">
            <label>شماره تماس</label>

            <input
                type="tel"
                placeholder="09xxxxxxxxx"
            >
        </div>

        <div class="field">
            <label>مبلغ معامله (تومان)</label>

            <input
                type="number"
                placeholder="مثلاً 500000"
            >
        </div>

        <div class="field">
            <label>توضیحات معامله</label>

            <textarea
                placeholder="توضیحات مربوط به اکانت و شرایط معامله..."
            ></textarea>
        </div>

        <button type="button">
            ایجاد اتاق معامله
        </button>

        <a href="index.html" class="back">
            ← بازگشت به صفحه اصلی
        </a>

    </div>

</div>

</body>
</html>
