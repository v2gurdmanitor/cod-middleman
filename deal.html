<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>اتاق معامله | V2GUARD</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(255,48,48,.12),
                    transparent 35%
                ),
                #050505;

            color: white;
            min-height: 100vh;
        }

        header {
            height: 70px;
            padding: 0 7%;

            display: flex;
            align-items: center;

            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ff3030;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 35px auto;
        }

        .top {
            text-align: center;
            margin-bottom: 25px;
        }

        .top h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .top p {
            color: #777;
            font-size: 13px;
        }

        .deal-info {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 20px;
        }

        .info {

            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 13px;

            padding: 17px;

            text-align: center;
        }

        .info-title {

            color: #777;

            font-size: 11px;

            margin-bottom: 8px;

        }

        .info-value {

            font-size: 14px;

            font-weight: bold;

        }

        .status {

            color: #ffcf5a;

        }

        .chat {

            background: #0d0d0d;

            border: 1px solid #222;

            border-radius: 18px;

            overflow: hidden;

        }

        .chat-header {

            padding: 17px 20px;

            border-bottom: 1px solid #222;

            font-weight: bold;

        }

        #messages {

            height: 430px;

            overflow-y: auto;

            padding: 20px;

        }

        .empty {

            text-align: center;

            color: #555;

            padding-top: 160px;

            font-size: 13px;

        }

        .message {

            margin-bottom: 13px;

            padding: 12px 14px;

            border-radius: 12px;

            background: #181818;

            max-width: 80%;

        }

        .message-name {

            font-size: 11px;

            color: #ff5555;

            margin-bottom: 5px;

        }

        .message-text {

            font-size: 13px;

            line-height: 1.8;

        }

        .message-time {

            font-size: 9px;

            color: #555;

            margin-top: 5px;

        }

        .send {

            display: flex;

            gap: 10px;

            padding: 15px;

            border-top: 1px solid #222;

        }

        .send input {

            flex: 1;

            background: #070707;

            border: 1px solid #292929;

            color: white;

            padding: 14px;

            border-radius: 10px;

            outline: none;

            font-family: inherit;

        }

        .send button {

            width: 110px;

            border: none;

            border-radius: 10px;

            background: #ff3030;

            color: white;

            font-family: inherit;

            font-weight: bold;

            cursor: pointer;

        }

        .notice {

            margin-top: 18px;

            background: rgba(255,48,48,.06);

            border: 1px solid rgba(255,48,48,.18);

            border-radius: 12px;

            padding: 15px;

            color: #aaa;

            font-size: 11px;

            line-height: 1.9;

        }

        .error {

            display: none;

            background: rgba(255,0,0,.08);

            border: 1px solid rgba(255,0,0,.25);

            color: #ff7777;

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 15px;

            font-size: 12px;

        }

        @media(max-width:650px) {

            .deal-info {

                grid-template-columns: 1fr;

            }

            #messages {

                height: 400px;
            }

            .send button {

                width: 80px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        V2<span>GUARD</span>

    </div>

</header>


<div class="container">


    <div class="top">

        <h1>
            اتاق معامله
        </h1>

        <p>
            محیط اختصاصی گفت‌وگوی خریدار و فروشنده
        </p>

    </div>


    <div
        id="error"
        class="error"
    ></div>


    <div class="deal-info">


        <div class="info">

            <div class="info-title">
                کد معامله
            </div>

            <div
                class="info-value"
                id="dealCode"
            >
                در حال بارگذاری...
            </div>

        </div>


        <div class="info">

            <div class="info-title">
                مبلغ
            </div>

            <div
                class="info-value"
                id="dealPrice"
            >
                ---
            </div>

        </div>


        <div class="info">

            <div class="info-title">
                وضعیت
            </div>

            <div
                class="info-value status"
                id="dealStatus"
            >
                در انتظار
            </div>

        </div>


    </div>


    <div class="chat">


        <div class="chat-header">

            💬 گفت‌وگوی معامله

        </div>


        <div id="messages">

            <div class="empty">
                در حال دریافت پیام‌ها...
            </div>

        </div>


        <div class="send">

            <input
                id="messageInput"
                type="text"
                placeholder="پیام خود را بنویسید..."
            >

            <button
                id="sendButton"
            >
                ارسال
            </button>

        </div>


    </div>


    <div class="notice">

        🔒 توجه: اطلاعات حساس اکانت را در چت ارسال نکنید.
        در مراحل بعدی سیستم تأیید مدیر و انتقال امن اطلاعات
        به معامله اضافه خواهد شد.

    </div>


</div>


<script>


/* ==========================================
   SUPABASE
========================================== */


const SUPABASE_URL =
    "https://hctppmmaiqkzcgxncyhi.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wP43H8AKwtVcTUBwcEzTxg_qKdFxzNa";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   گرفتن ID معامله از URL
========================================== */


const params =
    new URLSearchParams(
        window.location.search
    );


const dealId =
    params.get("id");


/* ==========================================
   نمایش خطا
========================================== */


function showError(message) {

    const box =
        document.getElementById("error");

    box.textContent = message;

    box.style.display = "block";

}


/* ==========================================
   فرمت مبلغ
========================================== */


function formatPrice(price) {

    return Number(price)
        .toLocaleString("fa-IR")
        + " تومان";

}


/* ==========================================
   دریافت معامله
========================================== */


async function loadDeal() {


    if (!dealId) {

        showError(
            "کد معامله در لینک وجود ندارد."
        );

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient

            .from("deals")

            .select("*")

            .eq(
                "deal_code",
                dealId
            )

            .single();


    if (error) {

        console.error(error);

        showError(
            "معامله پیدا نشد یا دسترسی به آن وجود ندارد."
        );

        return;

    }


    document
        .getElementById("dealCode")
        .textContent =
        data.deal_code;


    document
        .getElementById("dealPrice")
        .textContent =
        formatPrice(data.price);


    document
        .getElementById("dealStatus")
        .textContent =
        data.status === "waiting"
            ? "در انتظار"
            : data.status;


    /*
       فعلاً پیام نمونه برای تست
    */

    document
        .getElementById("messages")
        .innerHTML = `

            <div class="message">

                <div class="message-name">
                    سیستم V2GUARD
                </div>

                <div class="message-text">
                    معامله با موفقیت ایجاد شده است.
                    طرفین می‌توانند وارد گفت‌وگو شوند.
                </div>

            </div>

        `;

}


/* ==========================================
   ارسال پیام - فعلاً تستی
========================================== */


document
    .getElementById("sendButton")
    .addEventListener(
        "click",
        function () {


            const input =
                document.getElementById(
                    "messageInput"
                );


            const text =
                input.value.trim();


            if (!text) return;


            const messages =
                document.getElementById(
                    "messages"
                );


            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "message";


            message.innerHTML = `

                <div class="message-name">
                    شما
                </div>

                <div class="message-text">
                    ${escapeHtml(text)}
                </div>

            `;


            messages.appendChild(
                message
            );


            messages.scrollTop =
                messages.scrollHeight;


            input.value = "";

        }
    );


/* ==========================================
   جلوگیری از HTML Injection
========================================== */


function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;

}


/* ==========================================
   Enter برای ارسال
========================================== */


document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                document
                    .getElementById(
                        "sendButton"
                    )
                    .click();

            }

        }
    );


/* ==========================================
   شروع
========================================== */


loadDeal();


</script>


</body>

</html>
