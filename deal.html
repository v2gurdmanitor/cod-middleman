<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ایجاد معامله | V2GUARD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #220808, transparent 35%),
                #050505;
            color: #fff;
            min-height: 100vh;
        }

        header {
            padding: 20px 7%;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ff3030;
        }

        .container {
            width: min(650px, 92%);
            margin: 55px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .title p {
            color: #888;
            line-height: 1.8;
            font-size: 14px;
        }

        .box {
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 70px rgba(0,0,0,.35);
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            color: #ddd;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #292929;
            color: white;
            padding: 14px;
            border-radius: 11px;
            outline: none;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #ff3030;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .notice {
            background: rgba(255,48,48,.06);
            border: 1px solid rgba(255,48,48,.2);
            color: #aaa;
            padding: 15px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.9;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            border: none;
            background: #ff3030;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
        }

        button:hover {
            background: #ff4545;
            transform: translateY(-2px);
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(60,255,100,.05);
            border: 1px solid rgba(60,255,100,.2);
        }

        .result h3 {
            color: #6dff82;
            margin-bottom: 15px;
        }

        .deal-id {
            direction: ltr;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 15px 0;
        }

        .link-box {
            display: flex;
            gap: 8px;
        }

        .link-box input {
            direction: ltr;
            font-size: 11px;
        }

        .copy-btn {
            width: 90px;
            padding: 10px;
            background: #222;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }

        @media(max-width:600px) {
            .box {
                padding: 22px;
            }

            .title h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        V2<span>GUARD</span>
    </div>
</header>

<div class="container">

    <div class="title">
        <h1>ایجاد معامله</h1>

        <p>
            اطلاعات اولیه معامله را وارد کنید تا
            اتاق اختصاصی برای شما ایجاد شود.
        </p>
    </div>

    <div class="box">

        <div class="notice">
            ⚠️ اطلاعات ورود به اکانت را در این مرحله وارد نکنید.
            این صفحه فقط برای ایجاد معامله و اتاق گفتگو است.
        </div>

        <div class="field">
            <label>نقش شما</label>

            <select id="role">
                <option value="seller">فروشنده</option>
                <option value="buyer">خریدار</option>
            </select>
        </div>

        <div class="field">
            <label>نام یا شناسه شما</label>

            <input
                id="name"
                type="text"
                placeholder="مثلاً V2GUARD"
            >
        </div>

        <div class="field">
            <label>شماره تماس</label>

            <input
                id="phone"
                type="tel"
                placeholder="09xxxxxxxxx"
            >
        </div>

        <div class="field">
            <label>مبلغ معامله (تومان)</label>

            <input
                id="price"
                type="number"
                placeholder="مثلاً 500000"
            >
        </div>

        <div class="field">
            <label>توضیحات معامله</label>

            <textarea
                id="description"
                placeholder="توضیحات مربوط به اکانت و شرایط معامله..."
            ></textarea>
        </div>

        <button onclick="createDeal()">
            ایجاد اتاق معامله
        </button>

        <div class="result" id="result">

            <h3>
                ✅ معامله ایجاد شد
            </h3>

            <p>
                کد معامله شما:
            </p>

            <div class="deal-id" id="dealId"></div>

            <p style="color:#888;font-size:12px;">
                لینک زیر را برای طرف مقابل ارسال کنید:
            </p>

            <div class="link-box">

                <input
                    id="dealLink"
                    readonly
                >

                <button
                    class="copy-btn"
                    onclick="copyLink()"
                >
                    کپی
                </button>

            </div>

            <br>

            <button onclick="openDeal()">
                ورود به اتاق معامله
            </button>

        </div>

        <a href="index.html" class="back">
            ← بازگشت به صفحه اصلی
        </a>

    </div>

</div>

<script>

function generateDealId() {

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "V2G-";

    for (let i = 0; i < 6; i++) {
        result += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    return result;
}


function createDeal() {

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const price = document.getElementById("price").value.trim();

    if (!name || !phone || !price) {

        alert("لطفاً اطلاعات ضروری را کامل کنید.");

        return;
    }

    const dealId = generateDealId();

    const dealLink =
        window.location.origin +
        window.location.pathname.replace(
            "create-deal.html",
            "deal.html"
        ) +
        "?id=" +
        dealId;

    document.getElementById("dealId").textContent = dealId;

    document.getElementById("dealLink").value = dealLink;

    document.getElementById("result").style.display = "block";

    window.currentDealLink = dealLink;

    document
        .getElementById("result")
        .scrollIntoView({
            behavior: "smooth"
        });
}


function copyLink() {

    const link = document.getElementById("dealLink").value;

    navigator.clipboard.writeText(link)
        .then(() => {

            alert("لینک معامله کپی شد.");

        })
        .catch(() => {

            alert("کپی خودکار انجام نشد. لینک را دستی کپی کنید.");

        });
}


function openDeal() {

    if (window.currentDealLink) {

        window.location.href =
            window.currentDealLink;

    }

}

</script>

</body>
</html>
