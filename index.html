<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>COD MOBILE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top right,rgba(255,48,48,.12),transparent 35%),
        #050505;
    color:#fff;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    height:70px;
    padding:0 7%;
    display:flex;
    align-items:center;
    border-bottom:1px solid #222;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#ff3030;
}


/* =========================
   CONTENT
========================= */

.container{
    width:92%;
    max-width:1000px;
    margin:60px auto;
    text-align:center;
}

.container h1{
    font-size:35px;
    margin-bottom:15px;
}

.container p{
    color:#777;
    line-height:2;
    font-size:13px;
}


/* =========================
   SUPPORT BUTTON
========================= */

#supportButton{

    position:fixed;

    bottom:22px;
    right:22px;

    width:60px;
    height:60px;

    border-radius:50%;

    background:#ff3030;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;

    cursor:pointer;

    z-index:9999;

    box-shadow:
        0 10px 35px
        rgba(255,0,0,.35);

    transition:.2s;

}

#supportButton:hover{

    transform:scale(1.08);

    background:#ff4545;

}


/* =========================
   SUPPORT BOX
========================= */

#supportBox{

    display:none;

    position:fixed;

    right:22px;
    bottom:95px;

    width:360px;

    max-width:
        calc(100vw - 44px);

    height:520px;

    background:#0d0d0d;

    border:
        1px solid #292929;

    border-radius:20px;

    z-index:9998;

    overflow:hidden;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.7);

}


/* =========================
   SUPPORT HEADER
========================= */

.support-header{

    height:70px;

    padding:
        0 16px;

    border-bottom:
        1px solid #222;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.support-title{

    font-size:14px;

    font-weight:bold;

}


.support-online{

    color:#62ff82;

    font-size:9px;

    margin-top:5px;

}


.close-support{

    background:#222;

    border:0;

    color:#fff;

    border-radius:8px;

    padding:8px 11px;

    cursor:pointer;

}


/* =========================
   MESSAGES
========================= */

#supportMessages{

    height:390px;

    overflow-y:auto;

    padding:15px;

}


.support-empty{

    text-align:center;

    color:#555;

    padding-top:160px;

    font-size:11px;

}


/* =========================
   MESSAGE
========================= */

.support-message{

    max-width:84%;

    padding:
        10px 12px;

    border-radius:12px;

    margin-bottom:10px;

    background:#171717;

    border:
        1px solid #242424;

}


.support-message.user{

    margin-left:auto;

}


.support-message.admin{

    margin-right:auto;

    background:#2b1010;

    border-color:#652020;

}


.support-message-name{

    font-size:10px;

    margin-bottom:5px;

    font-weight:bold;

}


.support-message.user
.support-message-name{

    color:#ff5555;

}


.support-message.admin
.support-message-name{

    color:#ffcf5a;

}


.support-message-text{

    font-size:12px;

    line-height:1.8;

    word-break:break-word;

}


.support-message-time{

    color:#555;

    font-size:8px;

    margin-top:6px;

}


/* =========================
   SEND
========================= */

.support-send{

    height:60px;

    padding:10px;

    border-top:
        1px solid #222;

    display:flex;

    gap:8px;

}


#supportInput{

    flex:1;

    background:#070707;

    border:
        1px solid #292929;

    color:#fff;

    padding:11px;

    border-radius:10px;

    outline:none;

    font-family:inherit;

    font-size:12px;

}


#supportInput:focus{

    border-color:
        #ff3030;

}


#supportSendButton{

    width:70px;

    border:0;

    border-radius:10px;

    background:#ff3030;

    color:#fff;

    font-family:inherit;

    font-weight:bold;

    cursor:pointer;

}


#supportSendButton:hover{

    background:#ff4545;

}


#supportSendButton:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    #supportBox{

        right:10px;

        bottom:85px;

        width:
            calc(100vw - 20px);

        height:520px;

    }

    #supportMessages{

        height:390px;

    }

}

</style>
</head>


<body>


<header>

    <div class="logo">

        COD
        <span>MOBILE</span>

    </div>

</header>


<div class="container">

    <h1>
        COD MOBILE
    </h1>

    <p>
        برای دریافت راهنمایی و ارتباط با مدیریت،
        از دکمه پشتیبانی استفاده کنید.
    </p>

</div>


<!-- =========================
     SUPPORT BUTTON
========================= -->

<div
    id="supportButton"
    title="پشتیبانی"
>

    💬

</div>


<!-- =========================
     SUPPORT BOX
========================= -->

<div id="supportBox">


    <div class="support-header">

        <div>

            <div class="support-title">

                پشتیبانی

            </div>

            <div class="support-online">

                ● ارتباط خصوصی با مدیر

            </div>

        </div>


        <button
            class="close-support"
            onclick="closeSupport()"
        >

            ✕

        </button>

    </div>


    <div id="supportMessages">

        <div class="support-empty">

            در حال دریافت پیام‌ها...

        </div>

    </div>


    <div class="support-send">

        <input
            id="supportInput"
            type="text"
            placeholder="پیام خود را بنویسید..."
            autocomplete="off"
        >


        <button
            id="supportSendButton"
            onclick="sendSupportMessage()"
        >

            ارسال

        </button>

    </div>


</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://hctppmmaiqkzcgxncyhi.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wP43H8AKwtVcTUBwcEzTxg_qKdFxzNa";


const supportSupabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   USER ID
================================================== */

let supportVisitorId =
    localStorage.getItem(
        "cod_mobile_visitor_id"
    );


if(!supportVisitorId){

    supportVisitorId =
        crypto.randomUUID();

    localStorage.setItem(
        "cod_mobile_visitor_id",
        supportVisitorId
    );

}


/* ==================================================
   USER NAME
================================================== */

let supportName =
    localStorage.getItem(
        "cod_mobile_support_name"
    );


if(!supportName){

    supportName =
        prompt(
            "نام شما برای پشتیبانی:"
        );


    if(!supportName){

        supportName =
            "کاربر";

    }


    localStorage.setItem(
        "cod_mobile_support_name",
        supportName
    );

}


/* ==================================================
   OPEN SUPPORT
================================================== */

document
    .getElementById(
        "supportButton"
    )
    .addEventListener(
        "click",
        function(){

            document
                .getElementById(
                    "supportBox"
                )
                .style.display =
                "block";


            loadSupportMessages();

        }
    );


/* ==================================================
   CLOSE SUPPORT
================================================== */

function closeSupport(){

    document
        .getElementById(
            "supportBox"
        )
        .style.display =
        "none";

}


/* ==================================================
   LOAD MESSAGES
================================================== */

async function loadSupportMessages(){

    const box =
        document.getElementById(
            "supportMessages"
        );


    box.innerHTML = `

        <div class="support-empty">

            در حال دریافت پیام‌ها...

        </div>

    `;


    const result =
        await supportSupabase
        .from("support_messages")
        .select("*")
        .eq(
            "visitor_id",
            supportVisitorId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(result.error){

        console.error(
            result.error
        );


        box.innerHTML = `

            <div class="support-empty">

                خطا در دریافت پیام‌ها

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    const messages =
        result.data || [];


    if(messages.length === 0){

        box.innerHTML = `

            <div class="support-empty">

                هنوز پیامی ارسال نشده است.

            </div>

        `;

        return;

    }


    messages.forEach(
        renderSupportMessage
    );


    scrollSupportMessages();

}


/* ==================================================
   RENDER MESSAGE
================================================== */

function renderSupportMessage(message){

    const box =
        document.getElementById(
            "supportMessages"
        );


    const empty =
        box.querySelector(
            ".support-empty"
        );


    if(empty){

        empty.remove();

    }


    const div =
        document.createElement(
            "div"
        );


    const isAdmin =
        message.sender_role ===
        "admin";


    div.className =
        "support-message " +
        (
            isAdmin
            ? "admin"
            : "user"
        );


    const name =
        isAdmin
        ? "👑 مدیر"
        : "👤 شما";


    div.innerHTML = `

        <div class="support-message-name">

            ${escapeSupport(name)}

        </div>


        <div class="support-message-text">

            ${escapeSupport(
                message.message
            )}

        </div>


        <div class="support-message-time">

            ${
                message.created_at
                ?
                new Date(
                    message.created_at
                ).toLocaleTimeString(
                    "fa-IR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                )
                :
                ""
            }

        </div>

    `;


    box.appendChild(div);

}


/* ==================================================
   SEND MESSAGE
================================================== */

async function sendSupportMessage(){

    const input =
        document.getElementById(
            "supportInput"
        );


    const button =
        document.getElementById(
            "supportSendButton"
        );


    const text =
        input.value.trim();


    if(!text)
        return;


    button.disabled =
        true;


    const result =
        await supportSupabase
        .from("support_messages")
        .insert({

            visitor_id:
                supportVisitorId,

            sender_role:
                "user",

            sender_name:
                supportName,

            message:
                text

        })
        .select()
        .single();


    if(result.error){

        console.error(
            result.error
        );


        alert(
            "ارسال پیام انجام نشد:\n" +
            result.error.message
        );


        button.disabled =
            false;


        return;

    }


    input.value =
        "";


    renderSupportMessage(
        result.data
    );


    scrollSupportMessages();


    button.disabled =
        false;


    input.focus();

}


/* ==================================================
   ENTER
================================================== */

document
    .getElementById(
        "supportInput"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();

                sendSupportMessage();

            }

        }
    );


/* ==================================================
   REALTIME
================================================== */

supportSupabase
    .channel(
        "support-user-" +
        supportVisitorId
    )
    .on(
        "postgres_changes",
        {
            event:"INSERT",
            schema:"public",
            table:"support_messages",
            filter:
                "visitor_id=eq." +
                supportVisitorId
        },
        payload => {

            /*
                پیام خود کاربر
                قبلاً نمایش داده شده.
            */

            if(
                payload.new.sender_role
                ===
                "admin"
            ){

                renderSupportMessage(
                    payload.new
                );


                scrollSupportMessages();

            }

        }
    )
    .subscribe();


/* ==================================================
   SCROLL
================================================== */

function scrollSupportMessages(){

    const box =
        document.getElementById(
            "supportMessages"
        );


    box.scrollTop =
        box.scrollHeight;

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeSupport(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}

</script>

</body>
</html>
